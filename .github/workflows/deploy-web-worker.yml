name: Deploy web Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/web/**"
      - ".github/scripts/render-web-wrangler.mjs"
      - ".github/workflows/deploy-web-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meme-web-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: web-production
    defaults:
      run:
        working-directory: workers/web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
      WEB_WORKER_NAME: ${{ vars.WEB_WORKER_NAME }}
      D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      STORAGE_WORKER_NAME: ${{ vars.STORAGE_WORKER_NAME }}
      IMAGE_ORIGIN: ${{ vars.IMAGE_ORIGIN }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      GOOGLE_REDIRECT_URI: ${{ vars.GOOGLE_REDIRECT_URI }}
      GOOGLE_ALLOWED_EMAILS: ${{ vars.GOOGLE_ALLOWED_EMAILS }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/web/package-lock.json

      - run: npm ci
      - run: npm test --if-present

      - name: Render ephemeral Wrangler configuration
        run: node ../../.github/scripts/render-web-wrangler.mjs .wrangler.generated.jsonc

      - run: npm run types
      - run: npm run check
      - run: npx wrangler deploy --config .wrangler.generated.jsonc --dry-run --outdir dist

      - name: Deploy only the web Worker
        run: npm run deploy

      - name: Remove ephemeral configuration
        if: always()
        run: rm -f .wrangler.generated.jsonc src/worker-configuration.d.ts
