name: Build .NET origin

on:
  push:
    branches: [main]
    paths:
      - "origin-dotnet/**"
      - ".github/workflows/build-origin-dotnet.yml"
  pull_request:
    paths:
      - "origin-dotnet/**"
      - ".github/workflows/build-origin-dotnet.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meme-origin-dotnet-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            origin-dotnet/src/Meme.Origin/packages.lock.json
            origin-dotnet/test/Meme.Origin.Tests/packages.lock.json

      - name: Restore locked dependencies
        run: dotnet restore origin-dotnet/Meme.Origin.slnx --locked-mode

      - name: Test Release build
        run: dotnet test origin-dotnet/Meme.Origin.slnx --configuration Release --no-restore

      - name: Restore locked linux-x64 assets
        run: dotnet restore origin-dotnet/src/Meme.Origin/Meme.Origin.csproj --locked-mode --runtime linux-x64

      - name: Publish self-contained linux-x64 service
        run: >
          dotnet publish origin-dotnet/src/Meme.Origin/Meme.Origin.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained true
          --no-restore
          --output origin-dotnet/dist/publish
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Package systemd files
        run: cp -R origin-dotnet/deploy origin-dotnet/dist/deploy

      - uses: actions/upload-artifact@v4
        with:
          name: meme-origin-dotnet10-linux-x64-${{ github.sha }}
          path: origin-dotnet/dist
          if-no-files-found: error
          retention-days: 14
