name: Deploy storage Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/storage/**"
      - ".github/scripts/render-storage-wrangler.mjs"
      - ".github/workflows/deploy-storage-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meme-storage-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: storage-production
    defaults:
      run:
        working-directory: workers/storage
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
      STORAGE_WORKER_NAME: ${{ vars.STORAGE_WORKER_NAME }}
      VPC_SERVICE_ID: ${{ vars.VPC_SERVICE_ID }}
      ORIGIN_BASE_URL: ${{ vars.ORIGIN_BASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/storage/package-lock.json

      - run: npm ci

      - name: Render ephemeral Wrangler configuration
        run: node ../../.github/scripts/render-storage-wrangler.mjs .wrangler.generated.jsonc

      - name: Generate binding types
        run: npm run types

      - run: npm run typecheck
      - run: npm test
      - run: npx wrangler deploy --config .wrangler.generated.jsonc --dry-run --outdir dist

      - name: Deploy only the storage Worker
        run: npm run deploy

      - name: Remove ephemeral configuration
        if: always()
        run: rm -f .wrangler.generated.jsonc src/worker-configuration.d.ts
