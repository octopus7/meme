services:
  meme-origin:
    build:
      context: .
      dockerfile: Dockerfile
    image: meme-origin:local
    container_name: meme-origin
    restart: unless-stopped
    user: "${PUID:-1026}:${PGID:-100}"
    env_file:
      - .env
    ports:
      - "127.0.0.1:8086:8086"
    volumes:
      - "${MEME_HOST_ROOT:-/volume1/docker/meme-origin}/data:/var/lib/meme-origin"
      - "${MEME_HOST_ROOT:-/volume1/docker/meme-origin}/logs:/var/log/meme-origin"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8086/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
